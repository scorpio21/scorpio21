<svg width="100%" height="20" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="godotGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E6AA8"/>
      <stop offset="100%" stop-color="#6CB6FF"/>
    </linearGradient>

    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="clip">
      <rect width="60%" height="20" rx="10"/>
    </clipPath>
  </defs>

  <style>
    .bg { fill: #ddd; }
    .fg { fill: url(#godotGrad); }
    .label {
      fill: #000;
      font-size: 12px;
      font-family: sans-serif;
      font-weight: bold;
    }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #444; }
      .label { fill: #fff; }
    }
  </style>

  <rect class="bg" width="100%" height="20" rx="10"/>

  <rect class="fg" width="60%" height="20" rx="10">
    <animate attributeName="width"
             from="0"
             to="60%"
             dur="1s"
             fill="freeze"/>
  </rect>

  <rect x="-40"
        y="0"
        width="40"
        height="20"
        fill="url(#shine)"
        clip-path="url(#clip)">
    <animate attributeName="x"
             from="-40"
             to="100%"
             dur="2.5s"
             repeatCount="indefinite"/>
  </rect>

  <text class="label"
        x="95%"
        y="15"
        text-anchor="end">60%</text>
</svg>